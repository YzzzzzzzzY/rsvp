<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation Email Preview</title>
    <style>
        body {
            margin: 0;
            padding: 32px 16px;
            background: #ece7df;
            font-family: Georgia, "Times New Roman", serif;
        }

        .email-wrap {
            max-width: 600px;
            margin: 0 auto;
            background: #fffdf9;
            border: 1px solid #e8dfd2;
            box-shadow: 0 18px 50px rgba(0,0,0,0.08);
        }

        .email-hero img {
            display: block;
            width: 100%;
            height: auto;
        }

        .email-body {
            padding: 36px 40px 40px;
            color: #3a3a3a;
        }

        .eyebrow {
            font: 11px/1 Arial, sans-serif;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #8B4513;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
            font-weight: 400;
            line-height: 1.15;
            color: #2c2c2c;
        }

        .date-line {
            margin: 0 0 24px;
            font: 14px/1.6 Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7a6a5d;
        }

        p {
            margin: 0 0 18px;
            font-size: 17px;
            line-height: 1.75;
            color: #555;
        }

        .invite-link-wrap {
            margin: 28px 0 8px;
            padding: 18px 22px;
            text-align: center;
            background: #f5efe6;
            border: 1px solid #e8dfd2;
            border-radius: 2px;
        }

        .invite-link {
            display: inline-block;
            font: 15px/1.5 "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
            letter-spacing: 0.02em;
            color: #6d4c2a !important;
            text-decoration: none;
            word-break: break-all;
        }

        .invite-link:hover {
            color: #8B4513 !important;
        }

        .footer {
            padding: 0 40px 36px;
            font: 13px/1.6 Arial, sans-serif;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="email-wrap">
        <div class="email-hero">
            <img src="https://yzzzzzzzzy.github.io/rsvp/assets/images/hero-candidates/r13.jpg" alt="Zhen Yu and Yan Zhang">
        </div>

        <div class="email-body">
            <div class="eyebrow">Wedding Invitation</div>
            <h1>Zhen Yu &amp; Yan Zhang</h1>
            <p class="date-line">Saturday, August 22, 2026 · Menlo Park, California</p>

            <p>Dear {{ contact.FIRSTNAME }},</p>

            <p>
                You saved the date with us — thank you. We would be honored to celebrate
                with you. All the details and RSVP are here:
            </p>

            <div
                class="invite-link-wrap"
                style="margin:28px 0 8px;padding:18px 22px;text-align:center;background:#f5efe6;border:1px solid #e8dfd2;border-radius:2px;"
            >
                <a
                    class="invite-link"
                    href="https://yzzzzzzzzy.github.io/rsvp/"
                    style="display:inline-block;font:15px/1.5 Menlo,Consolas,'Courier New',monospace;letter-spacing:0.02em;color:#6d4c2a;text-decoration:none;"
                >https://YzzzzzzzzY.github.io/rsvp/</a>
            </div>
        </div>

        <div class="footer">
            With love,<br>
            Zhen &amp; Yan
        </div>
    </div>
</body>
</html>
