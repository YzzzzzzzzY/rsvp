<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wedding Seating Layout</title>
    <link rel="stylesheet" href="./seating.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">WEDDING FLOOR PLAN</p>
        <h1>Seating layout</h1>
        <p>Empty layout for planning · no guest information</p>
      </div>
      <div class="legend" aria-label="Table size legend">
        <span><i class="large-dot"></i>60-inch round</span>
        <span><i class="small-dot"></i>48-inch round</span>
        <span><i class="rect-dot"></i>8 / 6 / 8-foot rectangular</span>
      </div>
    </header>

    <main>
      <section class="summary" aria-label="Layout summary">
        <div><strong>80</strong><span>empty seats</span></div>
        <div><strong>11</strong><span>numbered tables</span></div>
        <div><strong>60″</strong><span>large round tables</span></div>
        <div><strong>48″</strong><span>small round tables</span></div>
      </section>

      <div class="plan-scroll">
        <section id="floor-plan" class="floor-plan" aria-label="Empty wedding seating floor plan">
          <div class="plan-title">
            <strong>Wedding Seating Chart</strong>
            <span>Empty numbered seats</span>
          </div>
          <div class="open-area">
            <strong>OPEN AREA</strong>
          </div>
          <div class="side-table-label">SIDE RECTANGULAR TABLES</div>
        </section>
      </div>
    </main>

    <script type="module" src="./seating.js"></script>
  </body>
</html>
